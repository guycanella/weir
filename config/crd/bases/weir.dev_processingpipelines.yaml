    listKind: ProcessingPipelineList
    plural: processingpipelines
    singular: processingpipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Status
      type: string
    - jsonPath: .status.backlog
      name: Backlog
      type: integer
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProcessingPipeline is the Schema for the processingpipelines
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ProcessingPipeline
            properties:
              scaling:
                description: |-
                  scaling captures the replica floor/ceiling and the backlog-per-replica
                  ratio used to derive the desired replica count.
                properties:
                  max:
                    description: max is the maximum number of worker replicas.
                    format: int32
                    minimum: 0
                    type: integer
                  min:
                    description: |-
                      min is the minimum number of worker replicas. 0 enables
                      scale-to-zero.
                    format: int32
                    minimum: 0
                    type: integer
                  perReplica:
                    description: |-
                      perReplica is the target number of backlog messages a single
                      replica should handle before another replica is added.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - max
                - min
                - perReplica
                type: object
              source:
                description: source describes where the pipeline reads its events
                  from.
                properties:
                  bucket:
                    description: |-
                      bucket is the name of the S3 bucket event notifications are read
                      from.
                    minLength: 1
                    pattern: \S
                    type: string
                  prefix:
                    description: prefix optionally scopes which object keys trigger
                      processing.
                    type: string
                required:
                - bucket
                type: object
              worker:
                description: worker describes the image that processes each event.
                properties:
                  concurrency:
                    default: 1
                    description: |-
                      concurrency is the number of events a single worker replica
                      processes in parallel.
                    format: int32
                    minimum: 1
                    type: integer
                  image:
                    description: image is the container image run for each worker
