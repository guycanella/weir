# This rule is not used by the project weir itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the weir.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: weir
    app.kubernetes.io/managed-by: kustomize
  name: processingpipeline-editor-role
rules:
- apiGroups:
  - weir.dev
  resources:
  - processingpipelines
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - weir.dev
  resources:
  - processingpipelines/status
  verbs:
  - get
